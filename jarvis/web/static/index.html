<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside id="sidebar">
    <button id="new-chat" type="button">+ Nueva conversación</button>
    <ul id="conversations"></ul>
  </aside>
  <main>
    <div id="messages" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="Escribe a Jarvis…" required></textarea>
      <button type="submit" id="send">Enviar</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
